name: SHWCASE Frontend Staging CICD

on:
  push:
    branches: [ "fe-stg" ]


jobs:
  deploy:
    runs-on: shwcase-runner

    steps:

    - name: Checkout source repository
      uses: actions/checkout@v4


    - name: Deploy Docker Container     
      run: |
        docker stop shwcase-stg-fe || true
        docker rm shwcase-stg-fe || true
        docker build . -t shwcase-stg-frontend:latest
        docker run -d -p 3021:8081 --name shwcase-stg-fe shwcase-stg-frontend:latest