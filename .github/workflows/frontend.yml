name: SHWCASE Frontend Live CICD

on:
  push:
    branches: [ "fe" ]


jobs:
  deploy:
    runs-on: shwcase-runner

    steps:

    - name: Checkout source repository
      uses: actions/checkout@v4

    - name: Create .env File
      run: |
        touch .env
        echo "VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}" >> .env
        echo "VITE_AUTH0_APP_DOMAIN=${{ secrets.VITE_AUTH0_APP_DOMAIN }}" >> .env
        echo "VITE_AUTH0_GOOGLE_APP_CLIENT_ID=${{ secrets.VITE_AUTH0_GOOGLE_APP_CLIENT_ID }}" >> .env
        echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" >> .env

    - name: Deploy Docker Container     
      run: |
        docker stop shwcase-fe || true
        docker rm shwcase-fe || true
        docker build . -t shwcase-frontend:latest
        docker run -d -p 3022:8081 --name shwcase-fe shwcase-frontend:latest