name: SHWCASE Frontend Live CICD

on:
  push:
    branches: [ "fe" ]


jobs:
  deploy:
    runs-on: shwcase-runner

    steps:

    - name: Checkout source repository
      uses: actions/checkout@v4


    - name: Deploy Docker Container     
      run: |
        docker stop shwcase-fe
        docker rm shwcase-fe
        docker build . -t shwcase-frontend:latest
        docker run -d -p 3022:8081 --name shwcase-fe shwcase-frontend:latest